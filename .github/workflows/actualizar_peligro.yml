name: Actualizar peligro de incendios

on:
workflow_dispatch:

schedule:
# Comprobaciones durante la mañana.
# Hora de España peninsular.
- cron: "30 10 * * *"
timezone: "Europe/Madrid"

```
- cron: "0 11 * * *"
  timezone: "Europe/Madrid"

- cron: "30 11 * * *"
  timezone: "Europe/Madrid"

- cron: "0 12 * * *"
  timezone: "Europe/Madrid"

- cron: "30 12 * * *"
  timezone: "Europe/Madrid"

- cron: "0 13 * * *"
  timezone: "Europe/Madrid"
```

jobs:

actualizar:

```
# Las ejecuciones automáticas solo se permiten
# durante las horas programadas.
#
# workflow_dispatch siempre se permite manualmente.
if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

runs-on: ubuntu-latest

permissions:
  contents: write

steps:

  - name: Descargar repositorio
    uses: actions/checkout@v6

  - name: Preparar Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.x"

  - name: Instalar dependencias
    run: |
      pip install requests openpyxl

  - name: Generar peligro.json
    run: |
      python generar_peligro.py

  - name: Generar archivos individuales
    run: |
      python generar_archivos_peligro.py

  - name: Guardar cambios
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add peligro.json peligro/

      git diff --cached --quiet || git commit -m "Actualizar peligro"

      git push
```
