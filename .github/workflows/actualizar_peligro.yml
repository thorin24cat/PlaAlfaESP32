name: Actualizar peligro de incendios

on:
workflow_dispatch:
schedule:
- cron: '30 8 * * *'
- cron: '0 9 * * *'
- cron: '30 9 * * *'

jobs:
actualizar:
runs-on: ubuntu-latest
permissions:
contents: write

```
steps:
  - uses: actions/checkout@v5

  - uses: actions/setup-python@v6
    with:
      python-version: '3.x'

  - run: pip install requests openpyxl playwright

  - run: playwright install --with-deps chromium

  - run: python generar_peligro.py

  - run: python generar_archivos_peligro.py

  - run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add peligro.json peligro/
      git diff --cached --quiet || git commit -m "Actualizar peligro"
      git push
```
